name: Terraform DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

env:
  TF_VERSION: "1.13.2"
  WORKING_DIR: "./environment/pre-prod"

permissions:
  contents: read
  security-events: write

jobs:

  terraform-scan:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      ####################################
      # TFLINT
      ####################################

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      ####################################
      # TFSEC
      ####################################

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ./environment/pre-prod

      ####################################
      # CHECKOV
      ####################################

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false

      ####################################
      # PLAN
      ####################################

      - name: Terraform Plan
        run: |
          terraform plan \
          -input=false \
          -out=tfplan

  terratest:
    name: Terratest
    runs-on: ubuntu-latest
    needs: terraform-scan

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Terratest
        run: |
          cd tests
          go mod tidy
          go test -v -timeout 30m

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs:
      - terraform-scan
      - terratest

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
