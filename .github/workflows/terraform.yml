
name: Terraform DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  TF_VERSION: "1.13.2"
  WORKING_DIR: "./environment/pre-prod"

# GitHub OIDC permissions
permissions:
  id-token: write
  contents: read
  security-events: write

jobs:

  # ============================================================
  # TERRAFORM SECURITY SCAN + VALIDATION + PLAN
  # ============================================================

  terraform-scan:
    name: Terraform Security Scan & Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:

      # ----------------------------------------------------------
      # Checkout Code
      # ----------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Azure Login using OIDC
      # ----------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------------------------
      # Terraform Format Check
      # ----------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        run: terraform init

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate

      # ==========================================================
      # TFSEC
      # ==========================================================

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ./environment/pre-prod

      # ==========================================================
      # CHECKOV
      # ==========================================================

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./environment/pre-prod
          framework: terraform
          soft_fail: false

      # ==========================================================
      # TERRAFORM PLAN
      # ==========================================================

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # ----------------------------------------------------------
      # Upload Terraform Plan
      # ----------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.WORKING_DIR }}/tfplan


  # ============================================================
  # PRODUCTION APPLY
  # ============================================================

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - terraform-scan

    # Apply ONLY when code is pushed directly to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # GitHub Environment
    # Add required reviewer in:
    # Repository → Settings → Environments → production
    environment:
      name: production

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:

      # ----------------------------------------------------------
      # Checkout Code
      # ----------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Azure Login using OIDC
      # ----------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        run: terraform init

      # ----------------------------------------------------------
      # Download Terraform Plan
      # ----------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.WORKING_DIR }}

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -input=false tfplan

